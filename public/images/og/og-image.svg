<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="blueLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Background decorative glows -->
  <circle cx="1000" cy="150" r="280" fill="#1d4ed8" opacity="0.18" filter="blur(70px)" />
  <circle cx="200" cy="500" r="250" fill="#84cc16" opacity="0.12" filter="blur(80px)" />

  <!-- Logo and Branding Header -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="70" height="70" rx="18" fill="#1d4ed8" />
    <text x="35" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
    <circle cx="58" cy="16" r="6" fill="#84cc16" />
    <text x="90" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800" fill="#ffffff">BSTC</text>
    <text x="210" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="0.15em" fill="#84cc16">CONSULTANTS</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="340" height="36" rx="18" fill="rgba(37,99,235,0.2)" stroke="rgba(59,130,246,0.4)" />
    <text x="20" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#93c5fd">
      ⚡ Registered Income Tax Practitioners (ITP)
    </text>

    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
      Professional Tax &amp; Corporate
    </text>
    <text x="0" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" fill="url(#blueLime)" letter-spacing="-0.02em">
      Consultancy in Pakistan
    </text>

    <text x="0" y="215" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      FBR NTN &amp; Sales Tax · SECP Registration · Provincial Tax (PRA, SRB, KPRA, BRA) · Bookkeeping
    </text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(100, 520)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#64748b">
      Led by Hassan Zeb (ITP) · Islamabad &amp; Swat, Pakistan · bstc.com.pk
    </text>
  </g>
</svg>
