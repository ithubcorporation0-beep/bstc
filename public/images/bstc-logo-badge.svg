<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="badge-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182030" />
      <stop offset="70%" stop-color="#0c121e" />
      <stop offset="100%" stop-color="#04070d" />
    </radialGradient>

    <!-- 4 Bar Gradients matching authentic card -->
    <!-- Bar 1: B (Teal / Turquoise) -->
    <linearGradient id="bar-b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <!-- Bar 2: S (Forest Green) -->
    <linearGradient id="bar-s" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <!-- Bar 3: T (Warm Yellow / Gold) -->
    <linearGradient id="bar-t" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <!-- Bar 4: C (Vibrant Lime) -->
    <linearGradient id="bar-c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>

    <!-- Drop Shadows & Glows -->
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow-swoosh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.35" />
    </filter>

    <!-- Text Curved Paths -->
    <path id="top-arc" d="M 90 250 A 160 160 0 0 1 410 250" fill="none" />
    <path id="bottom-arc" d="M 410 250 A 160 160 0 0 1 90 250" fill="none" />
  </defs>

  <!-- Octagonal / Squircle Badge Outer Shield -->
  <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#badge-bg)" stroke="#334155" stroke-width="4" filter="url(#badge-shadow)" />
  <rect x="38" y="38" width="424" height="424" rx="78" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Circular Outer Text Track -->
  <circle cx="250" cy="250" r="162" fill="none" stroke="#475569" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="250" cy="250" r="126" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Curved Text: Top & Bottom -->
  <text fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="0.22em">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
      BUSINESS SOLUTIONS
    </textPath>
  </text>

  <text fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="0.22em">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
      TAX CONSULTANTS
    </textPath>
  </text>

  <!-- Vertical Divider Bars in text ring -->
  <circle cx="90" cy="250" r="4" fill="#facc15" />
  <circle cx="410" cy="250" r="4" fill="#facc15" />

  <!-- Center Emblem Group: 4 Slanted BSTC Bars + Checkmark Swoosh -->
  <g id="center-emblem" transform="translate(0, -5)">
    <!-- Bar 1: B (Teal / Turquoise) -->
    <polygon points="198,280 226,280 236,220 208,220" fill="url(#bar-b)" />
    <text x="216" y="260" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="23" font-weight="900" fill="#ffffff" text-anchor="middle" transform="skewX(-10) translate(36, 0)">B</text>

    <!-- Bar 2: S (Forest Green) -->
    <polygon points="228,268 256,268 268,195 240,195" fill="url(#bar-s)" />
    <text x="246" y="243" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" transform="skewX(-10) translate(33, 0)">S</text>

    <!-- Bar 3: T (Warm Yellow / Gold) -->
    <polygon points="258,256 286,256 298,170 270,170" fill="url(#bar-t)" />
    <text x="276" y="224" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" transform="skewX(-10) translate(30, 0)">T</text>

    <!-- Bar 4: C (Vibrant Lime Green) -->
    <polygon points="288,244 316,244 328,145 300,145" fill="url(#bar-c)" />
    <text x="306" y="206" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" transform="skewX(-10) translate(26, 0)">C</text>

    <!-- Checkmark Swoosh -->
    <path d="M 182 258 
             L 218 318 
             C 225 330, 235 328, 248 310
             L 326 218 
             C 334 208, 332 202, 320 208
             L 242 278 
             C 234 286, 226 286, 220 274
             L 192 246 
             Z" 
          fill="#ffffff" 
          filter="url(#glow-swoosh)" />
  </g>
</svg>
