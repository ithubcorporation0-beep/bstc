<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bstcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1d4ed8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#bstcGrad)" />
    <!-- Geometric abstract 'B' and growth chevron -->
    <path d="M28 26 H56 C68 26 76 34 76 44 C76 52 70 58 60 60 C72 62 78 70 78 80 C78 90 68 98 56 98 H28 V26 Z M42 40 V52 H54 C58 52 62 49 62 46 C62 43 58 40 54 40 Z M42 66 V84 H56 C60 84 64 81 64 75 C64 69 60 66 56 66 Z" fill="#ffffff" />
    <circle cx="78" cy="24" r="8" fill="url(#limeGrad)" />
    <path d="M72 82 L84 70 L90 76" stroke="url(#limeGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.03em" fill="#1d4ed8" class="logo-text-bstc">
      BSTC
    </text>
    <text x="126" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="0.18em" fill="#84cc16">
      CONSULTANTS
    </text>
    <text x="0" y="74" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500" letter-spacing="0.02em" fill="#64748b" class="logo-subtext">
      Business Solutions &amp; Tax Consultancy Pakistan
    </text>
  </g>
</svg>
